<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchers Cricket — Upcoming Milestones</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a3d1f;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { width: 52px; height: 52px; border-radius: 50%; margin-bottom: 8px; }
    .header h1 { color: white; font-size: 22px; font-weight: 700; }
    .header p { color: #9ecfb0; font-size: 13px; margin-top: 4px; }

    .toggle-bar {
      display: flex; justify-content: center; gap: 8px;
      margin-bottom: 20px;
    }
    .toggle-btn {
      padding: 7px 18px; border-radius: 20px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.2s;
    }
    .toggle-btn.active   { background: white; color: #0a3d1f; }
    .toggle-btn.inactive { background: rgba(255,255,255,0.15); color: #9ecfb0; }
    .toggle-btn.inactive:hover { background: rgba(255,255,255,0.25); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }

    .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .card-title { font-size: 14px; font-weight: 700; color: #0a3d1f; margin-bottom: 14px; }
    .empty { color: #bbb; font-size: 13px; text-align: center; padding: 10px 0; }

    .milestone-row { padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-row.hot { background: #fffbea; border-radius: 8px; padding: 9px 8px; margin: 2px -8px; }

    .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .player-name { font-size: 13px; font-weight: 600; color: #222; }
    .milestone-row.hot .player-name { color: #a05f00; }

    .gap-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; white-space: nowrap; }
    .milestone-row.hot .gap-badge { background: #fff3cd; color: #856404; }

    .progress-wrap { height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
    .progress-bar  { height: 100%; border-radius: 3px; background: #2ecc71; }
    .milestone-row.hot .progress-bar { background: #f39c12; }

    .row-bottom { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 4px; }

    .view-more-wrap { text-align: center; margin-top: 8px; }
    .view-more-btn {
      background: none; border: none; color: #0a3d1f; font-size: 12px; font-weight: 600;
      cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px;
    }
    .extra-rows { display: none; }
    .extra-rows.open { display: block; }

    .loading { color: #9ecfb0; text-align: center; padding: 40px; font-size: 14px; }
    .error   { color: #e74c3c; text-align: center; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://karkhile.github.io/butchers-cricket/logo.png" onerror="this.style.display='none'" alt="">
    <h1>Upcoming Milestones</h1>
    <p id="updated-at">Loading…</p>
  </div>

  <div class="toggle-bar">
    <button class="toggle-btn active"   id="btn-big" onclick="setView('big')">Major milestones</button>
    <button class="toggle-btn inactive" id="btn-all" onclick="setView('all')">All milestones</button>
  </div>

  <div id="content" class="loading">Fetching milestones…</div>

  <script>
    let _data = null;
    let _view = 'big';

    const CARDS = [
      { key: 'batting',      title: '🏏 Batting',          unit: 'runs',        gap: 'runs needed'       },
      { key: 'bowling',      title: '🔴 Bowling',          unit: 'wkts',        gap: 'wickets needed'    },
      { key: 'totalCatches', title: '🤲 Total Catches',   unit: 'catches',     gap: 'catches needed'    },
      { key: 'catches',      title: '↳ Field Catches',     unit: 'catches',     gap: 'catches needed'    },
      { key: 'keeperCt',     title: '↳ Keeper Catches',    unit: 'catches',     gap: 'catches needed'    },
      { key: 'stumpings',    title: '🪄 Stumpings',        unit: 'stumpings',   gap: 'stumpings needed'  },
      { key: 'runOuts',      title: '🏃 Run-Outs',         unit: 'run-outs',    gap: 'run-outs needed'   },
    ];

    fetch('./milestones.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        _data = data;
        const d = new Date(data.updatedAt);
        document.getElementById('updated-at').textContent =
          'Updated ' + d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
        render();
      })
      .catch(() => {
        document.getElementById('content').className = 'error';
        document.getElementById('content').textContent = 'Could not load milestones data.';
      });

    function setView(v) {
      _view = v;
      document.getElementById('btn-big').className = 'toggle-btn ' + (v === 'big' ? 'active' : 'inactive');
      document.getElementById('btn-all').className = 'toggle-btn ' + (v === 'all' ? 'active' : 'inactive');
      if (_data) render();
    }

    function render() {
      const el = document.getElementById('content');
      el.className = 'grid';
      el.innerHTML = '';
      for (const c of CARDS) {
        const items = (_data[c.key] || {})[_view] || [];
        el.appendChild(buildCard(c.title, items, c.unit, c.gap));
      }
    }

    function buildCard(title, items, unit, gapLabel) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';

      if (!items.length) {
        card.innerHTML += '<div class="empty">No upcoming milestones</div>';
        return card;
      }

      // Show first 5 inline, rest in collapsible section
      const SHOW = 5;
      const main  = items.slice(0, SHOW);
      const extra = items.slice(SHOW);

      for (const item of main)  card.appendChild(makeRow(item, unit, gapLabel));

      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        for (const item of extra) extraWrap.appendChild(makeRow(item, unit, gapLabel));
        card.appendChild(extraWrap);

        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => {
          const open = extraWrap.classList.toggle('open');
          btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more';
        };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }

      return card;
    }

    function makeRow(item, unit, gapLabel) {
      const hot = item.gap <= Math.ceil(item.next * 0.05) || item.gap <= 2;
      const pct = Math.min(99, Math.round(item.current / item.next * 100));
      const row = document.createElement('div');
      row.className = 'milestone-row' + (hot ? ' hot' : '');
      row.innerHTML =
        '<div class="row-top">' +
          '<span class="player-name">' + item.name + (hot ? ' 🔥' : '') + '</span>' +
          '<span class="gap-badge">' + item.gap + ' ' + gapLabel + '</span>' +
        '</div>' +
        '<div class="progress-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="row-bottom"><span>' + item.current + ' ' + unit + '</span><span>🎯 ' + item.next + ' ' + unit + '</span></div>';
      return row;
    }
  </script>
</body>
</html>
