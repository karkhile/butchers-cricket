<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchers Cricket — Upcoming Milestones</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a3d1f;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { width: 52px; height: 52px; border-radius: 50%; margin-bottom: 8px; }
    .header h1 { color: white; font-size: 22px; font-weight: 700; }
    .header p { color: #9ecfb0; font-size: 13px; margin-top: 4px; }

    .toggle-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .toggle-btn {
      padding: 7px 18px; border-radius: 20px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.2s;
    }
    .toggle-btn.active   { background: white; color: #0a3d1f; }
    .toggle-btn.inactive { background: rgba(255,255,255,0.15); color: #9ecfb0; }
    .toggle-btn.inactive:hover { background: rgba(255,255,255,0.25); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }

    .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .card-title { font-size: 14px; font-weight: 700; color: #0a3d1f; margin-bottom: 14px; }
    .empty { color: #bbb; font-size: 13px; text-align: center; padding: 10px 0; }

    /* upcoming rows */
    .milestone-row { padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-row.hot { background: #fffbea; border-radius: 8px; padding: 9px 8px; margin: 2px -8px; }
    .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .player-name { font-size: 13px; font-weight: 600; color: #222; }
    .milestone-row.hot .player-name { color: #a05f00; }
    .gap-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; white-space: nowrap; }
    .milestone-row.hot .gap-badge { background: #fff3cd; color: #856404; }
    .progress-wrap { height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
    .progress-bar  { height: 100%; border-radius: 3px; background: #2ecc71; }
    .milestone-row.hot .progress-bar { background: #f39c12; }
    .row-bottom { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 4px; }

    /* achieved rows */
    .achieved-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .achieved-row:last-child { border-bottom: none; }
    .achieved-name { font-size: 13px; font-weight: 600; color: #222; }
    .achieved-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; white-space: nowrap; }
    .achieved-sub { font-size: 11px; color: #aaa; margin-top: 1px; }

    .view-more-wrap { text-align: center; margin-top: 8px; }
    .view-more-btn {
      background: none; border: none; color: #0a3d1f; font-size: 12px; font-weight: 600;
      cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px;
    }
    .extra-rows { display: none; }
    .extra-rows.open { display: block; }

    /* fastest tab */
    .fastest-card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .fastest-card .card-title { font-size: 14px; font-weight: 700; color: #0a3d1f; margin-bottom: 14px; }
    .fastest-section { margin-bottom: 16px; }
    .fastest-section:last-child { margin-bottom: 0; }
    .fastest-threshold { font-size: 12px; font-weight: 700; color: #0a3d1f; background: #e8f5e9; border-radius: 8px; padding: 4px 10px; display: inline-block; margin-bottom: 6px; }
    .fastest-entry { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #f5f5f5; }
    .fastest-entry:last-child { border-bottom: none; }
    .fastest-rank { font-size: 12px; font-weight: 700; color: #888; width: 20px; flex-shrink: 0; }
    .fastest-rank.gold   { color: #f0b429; }
    .fastest-rank.silver { color: #8f9ba8; }
    .fastest-rank.bronze { color: #c17b3d; }
    .fastest-name  { font-size: 13px; font-weight: 600; color: #222; flex: 1; }
    .fastest-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; white-space: nowrap; }

    /* rivalry tab */
    .rivalry-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
    .rivalry-row:last-child { border-bottom: none; }
    .rivalry-rank { font-size: 12px; font-weight: 700; color: #888; width: 22px; flex-shrink: 0; }
    .rivalry-rank.gold   { color: #f0b429; }
    .rivalry-rank.silver { color: #8f9ba8; }
    .rivalry-rank.bronze { color: #c17b3d; }
    .rivalry-names { flex: 1; }
    .rivalry-batter { font-size: 13px; font-weight: 600; color: #222; }
    .rivalry-bowler { font-size: 11px; color: #888; margin-top: 1px; }
    .rivalry-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; white-space: nowrap; }

    .loading { color: #9ecfb0; text-align: center; padding: 40px; font-size: 14px; }
    .error   { color: #e74c3c; text-align: center; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://karkhile.github.io/butchers-cricket/logo.png" onerror="this.style.display='none'" alt="">
    <h1>Milestones</h1>
    <p id="updated-at">Loading…</p>
  </div>

  <div class="toggle-bar">
    <button class="toggle-btn active"   id="btn-big"      onclick="setView('big')">Major upcoming</button>
    <button class="toggle-btn inactive" id="btn-all"      onclick="setView('all')">All upcoming</button>
    <button class="toggle-btn inactive" id="btn-achieved" onclick="setView('achieved')">🏆 Achieved</button>
    <button class="toggle-btn inactive" id="btn-fastest"  onclick="setView('fastest')">⚡ Fastest</button>
    <button class="toggle-btn inactive" id="btn-rivalries" onclick="setView('rivalries')">⚔️ Rivalries</button>
    <button class="toggle-btn inactive" id="btn-analysis" onclick="setView('analysis')">📊 Analysis</button>
  </div>

  <div id="content" class="loading">Fetching milestones…</div>

  <script>
    let _data = null;
    let _view = 'big';

    const CARDS = [
      { key: 'batting',      title: '🏏 Batting',        unit: 'runs',       gap: 'runs needed'      },
      { key: 'fours',        title: '4️⃣  Fours',          unit: 'fours',      gap: 'fours needed'     },
      { key: 'sixes',        title: '6️⃣  Sixes',          unit: 'sixes',      gap: 'sixes needed'     },
      { key: 'bowling',      title: '🔴 Bowling',        unit: 'wkts',       gap: 'wickets needed'   },
      { key: 'totalCatches', title: '🤲 Total Catches',  unit: 'catches',    gap: 'catches needed'   },
      { key: 'catches',      title: '↳ Field Catches',   unit: 'catches',    gap: 'catches needed'   },
      { key: 'keeperCt',     title: '↳ Keeper Catches',  unit: 'catches',    gap: 'catches needed'   },
      { key: 'stumpings',    title: '🪄 Stumpings',      unit: 'stumpings',  gap: 'stumpings needed' },
      { key: 'runOuts',      title: '🏃 Run-Outs',       unit: 'run-outs',   gap: 'run-outs needed'  },
      { key: 'mom',          title: '⭐ Player of Match', unit: 'awards',     gap: 'awards needed'    },
    ];

    fetch('./milestones.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        _data = data;
        const d = new Date(data.updatedAt);
        document.getElementById('updated-at').textContent =
          'Updated ' + d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
        render();
      })
      .catch(() => {
        document.getElementById('content').className = 'error';
        document.getElementById('content').textContent = 'Could not load milestones data.';
      });

    function setView(v) {
      _view = v;
      ['big','all','achieved','fastest','rivalries','analysis'].forEach(k => {
        document.getElementById('btn-' + k).className = 'toggle-btn ' + (v === k ? 'active' : 'inactive');
      });
      if (_data) render();
    }

    function render() {
      const el = document.getElementById('content');
      el.className = 'grid';
      el.innerHTML = '';
      if (_view === 'achieved') {
        for (const c of CARDS) {
          const items = (_data[c.key] || {}).achieved || [];
          el.appendChild(buildAchievedCard(c.title, items, c.unit));
        }
      } else if (_view === 'rivalries') {
        renderRivalries(el);
      } else if (_view === 'analysis') {
        renderAnalysis(el);
      } else if (_view === 'fastest') {
        renderFastest(el);
      } else {
        for (const c of CARDS) {
          const items = (_data[c.key] || {})[_view] || [];
          el.appendChild(buildCard(c.title, items, c.unit, c.gap));
        }
      }
    }

    function buildCard(title, items, unit, gapLabel) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No upcoming milestones</div>'; return card; }

      const SHOW = 5;
      for (const item of items.slice(0, SHOW)) card.appendChild(makeRow(item, unit, gapLabel));

      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        for (const item of extra) extraWrap.appendChild(makeRow(item, unit, gapLabel));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function buildAchievedCard(title, items, unit) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No milestones achieved yet</div>'; return card; }

      const SHOW = 5;
      for (const item of items.slice(0, SHOW)) card.appendChild(makeAchievedRow(item, unit));

      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        for (const item of extra) extraWrap.appendChild(makeAchievedRow(item, unit));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function makeRow(item, unit, gapLabel) {
      const hot = item.gap <= Math.ceil(item.next * 0.05) || item.gap <= 2;
      const pct = Math.min(99, Math.round(item.current / item.next * 100));
      const row = document.createElement('div');
      row.className = 'milestone-row' + (hot ? ' hot' : '');
      row.innerHTML =
        '<div class="row-top">' +
          '<span class="player-name">' + item.name + (hot ? ' 🔥' : '') + '</span>' +
          '<span class="gap-badge">' + item.gap + ' ' + gapLabel + '</span>' +
        '</div>' +
        '<div class="progress-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="row-bottom"><span>' + item.current + ' ' + unit + '</span><span>🎯 ' + item.next + ' ' + unit + '</span></div>';
      return row;
    }

    function makeAchievedRow(item, unit) {
      const row = document.createElement('div');
      row.className = 'achieved-row';
      row.innerHTML =
        '<div>' +
          '<div class="achieved-name">🏆 ' + item.name + '</div>' +
          '<div class="achieved-sub">' + item.current + ' ' + unit + ' total</div>' +
        '</div>' +
        '<span class="achieved-badge">✓ ' + item.achieved + ' ' + unit + '</span>';
      return row;
    }

    const FASTEST_CARDS = [
      { key: 'batting',     title: '🏏 Batting',        unit: 'matches', suffix: 'runs'     },
      { key: 'fours',       title: '4️⃣  Fours',          unit: 'matches', suffix: 'fours'    },
      { key: 'sixes',       title: '6️⃣  Sixes',          unit: 'matches', suffix: 'sixes'    },
      { key: 'bowling',     title: '🔴 Bowling',        unit: 'matches', suffix: 'wickets'  },
      { key: 'totalCatch',  title: '🤲 Total Catches',  unit: 'matches', suffix: 'catches'  },
      { key: 'fieldCatch',  title: '↳ Field Catches',   unit: 'matches', suffix: 'catches'  },
      { key: 'keeperCatch', title: '↳ Keeper Catches',  unit: 'matches', suffix: 'catches'  },
      { key: 'stumpings',   title: '🪄 Stumpings',      unit: 'matches', suffix: 'stumpings'},
      { key: 'runOuts',     title: '🏃 Run-Outs',       unit: 'matches', suffix: 'run-outs' },
      { key: 'mom',         title: '⭐ Player of Match', unit: 'matches', suffix: 'awards'   },
    ];

    function buildTopOversCard(topOvers) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">💥 Most Runs in an Over</div>';
      if (!topOvers.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      let displayRank = 0;
      let prevRuns = null;
      topOvers.forEach((entry, i) => {
        if (entry.runs !== prevRuns) { displayRank = i; prevRuns = entry.runs; }
        const sec = document.createElement('div');
        sec.className = 'fastest-section';
        const rankHtml = displayRank < 3
          ? '<span class="fastest-rank ' + rankClasses[displayRank] + '">' + rankLabels[displayRank] + '</span>'
          : '<span class="fastest-rank">' + (displayRank + 1) + '</span>';
        const batterLines = (entry.batters || []).map(b => b.name + ' ' + b.runs).join(', ');
        sec.innerHTML =
          '<div class="fastest-entry">' +
            rankHtml +
            '<span class="fastest-name">' + entry.runs + ' runs — ' + entry.over + '</span>' +
            '<span class="fastest-badge">' + entry.date + '</span>' +
          '</div>' +
          '<div style="font-size:11px;color:#555;padding:2px 0 2px 28px;">🎳 ' + entry.bowler + '</div>' +
          '<div style="font-size:11px;color:#555;padding:2px 0 6px 28px;">🏏 ' + batterLines + '</div>';
        card.appendChild(sec);
      });
      return card;
    }

    function renderFastest(el) {
      const fastest = (_data.fastest || {});
      for (const c of FASTEST_CARDS) {
        const thresholds = fastest[c.key] || [];
        el.appendChild(buildFastestCard(c.title, thresholds, c.suffix));
      }
      el.appendChild(buildTopOversCard(_data.topOvers || []));
    }

    function buildFastestCard(title, thresholds, suffix) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!thresholds.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      for (const t of thresholds) {
        const sec = document.createElement('div');
        sec.className = 'fastest-section';
        sec.innerHTML = '<div class="fastest-threshold">⚡ First to ' + t.threshold + ' ' + suffix + '</div>';
        const rankLabels = ['🥇','🥈','🥉'];
        const rankClasses = ['gold','silver','bronze'];
        t.entries.forEach((e, i) => {
          const row = document.createElement('div');
          row.className = 'fastest-entry';
          const rankHtml = i < 3
            ? '<span class="fastest-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
            : '<span class="fastest-rank">' + (i + 1) + '</span>';
          row.innerHTML = rankHtml +
            '<span class="fastest-name">' + e.name + '</span>' +
            '<span class="fastest-badge">match ' + e.matches + '</span>';
          sec.appendChild(row);
        });
        card.appendChild(sec);
      }
      return card;
    }
    function buildGameChangerCard(title, items, role) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const SHOW = 10;
      const makeRow = (item, i) => {
        const row = document.createElement('div');
        row.className = 'rivalry-row';
        const rankHtml = i < 3
          ? '<span class="rivalry-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="rivalry-rank">' + (i + 1) + '</span>';
        const detail = role === 'batter'
          ? (item.instances||[]).map(x => x.runs + (x.won ? '✓' : '✗')).join(', ')
          : (item.instances||[]).map(x => x.wkts + 'wkt vs ' + x.teamTotal + '✓').join(', ');
        const badge = role === 'batter'
          ? item.wins + '/' + item.count + ' wins'
          : item.count + 'x';
        row.innerHTML = rankHtml +
          '<div class="rivalry-names">' +
            '<div class="rivalry-batter">' + item.name + '</div>' +
            '<div class="rivalry-bowler" style="font-size:10px;">' + detail + '</div>' +
          '</div>' +
          '<span class="rivalry-badge">' + badge + '</span>';
        return row;
      };
      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function buildDotBallsCard(items) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">🔴 Most Dot Balls %</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const SHOW = 10;
      const makeRow = (item, i) => {
        const row = document.createElement('div');
        row.className = 'fastest-entry';
        const rankHtml = i < 3
          ? '<span class="fastest-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="fastest-rank">' + (i + 1) + '</span>';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + item.name +
            '<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px;">' + item.dots + ' dots / ' + item.balls + ' balls</span>' +
          '</span>' +
          '<span class="fastest-badge">' + item.pct + '%</span>';
        return row;
      };
      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function buildBoundaryOffCard(title, items, countKey, label) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const SHOW = 10;
      const makeRow = (item, i) => {
        const row = document.createElement('div');
        row.className = 'fastest-entry';
        const rankHtml = i < 3
          ? '<span class="fastest-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="fastest-rank">' + (i + 1) + '</span>';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + item.name +
            '<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px;">' + item[countKey] + ' ' + label + 's / ' + item.balls + ' balls</span>' +
          '</span>' +
          '<span class="fastest-badge">' + item.pct + '%</span>';
        return row;
      };
      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }

    function buildDisciplinedCard(items) {
      const card = document.createElement('div');

        row.className = 'fastest-entry';
        const rankHtml = i < 3

          : '<span class="fastest-rank">' + (i + 1) + '</span>';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + item.name +
            '<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px;">' + item.wides + 'w · ' + item.noBalls + 'nb / ' + item.balls + ' balls</span>' +
          '</span>' +
          '<span class="fastest-badge">' + item.pct + '%</span>';

      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);

        const extraWrap = document.createElement('div');

        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');

        btn.textContent = '+ ' + extra.length + ' more';

        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;

    function buildEconomyCard(title, items, unit) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const SHOW = 10;

        const rankHtml = i < 3

          : '<span class="fastest-rank">' + (i + 1) + '</span>';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + item.name + '</span>' +
          '<span class="fastest-badge">' + item.count + ' ' + unit + '</span>';

    function renderAnalysis(el) {
      el.appendChild(buildMatchRescuersCard(_data.matchRescuers || []));
      el.appendChild(buildDisciplinedCard(_data.disciplined || []));
      el.appendChild(buildBoundaryOffCard('6️⃣ Sixes Conceded %', _data.sixesOffPct || [], 'sixes', 'six'));
      el.appendChild(buildBoundaryOffCard('4️⃣ Fours Conceded %', _data.foursOffPct || [], 'fours', 'four'));
      el.appendChild(buildDotBallsCard(_data.dotBalls || []));
      const gc = _data.gameChangers || {};
      el.appendChild(buildGameChangerCard('🦸 Chase Rescuers', gc.rescuers || [], 'batter'));
      el.appendChild(buildGameChangerCard('🛡️ Low-Score Defenders', gc.defenders || [], 'bowler'));
    }

    function buildMatchRescuersCard(items) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">🚨 Match Rescuers</div>' +
        '<div style="font-size:11px;color:#888;margin-bottom:10px;">Times top WPA contributor when team win% was below 50% — and team still won</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const SHOW = 10;
      const makeRow = (item, i) => {
        const wrap = document.createElement('div');
        // Header row
        const row = document.createElement('div');
        row.className = 'fastest-entry';
        row.style.cursor = 'pointer';
        const rankHtml = i < 3
          ? '<span class="fastest-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="fastest-rank">' + (i + 1) + '</span>';
        const lowestWp = item.instances.length ? Math.min(...item.instances.map(x => x.lowestWp)) : null;
        const subtleHtml = lowestWp !== null
          ? '<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px;">lowest ' + lowestWp + '%</span>'
          : '';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + item.name + subtleHtml + '</span>' +
          '<span class="fastest-badge" style="background:#e8f5e9;color:#1b5e20;">' + item.count + ' rescue' + (item.count > 1 ? 's' : '') + '</span>';
        wrap.appendChild(row);

        // Instance rows (hidden by default, toggle on click)
        if (item.instances && item.instances.length) {
          const detail = document.createElement('div');
          detail.style.cssText = 'display:none;padding:4px 0 8px 36px;';
          item.instances.forEach(inst => {
            const d = document.createElement('div');
            d.style.cssText = 'font-size:11px;color:#555;padding:3px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;';
            d.innerHTML =
              '<span>' + (inst.date || '') + ' · ' + (inst.type === 'bowl' ? '🎳 defending' : '🏏 chasing') + ' · win% was <strong style="color:#c0392b;">' + inst.lowestWp + '%</strong> → won</span>' +
              '<span style="color:#1b5e20;font-weight:600;">+' + inst.rescueWpa.toFixed(2) + ' WPA</span>';
            detail.appendChild(d);
          });
          wrap.appendChild(detail);
          row.addEventListener('click', () => {
            const open = detail.style.display === 'none';
            detail.style.display = open ? 'block' : 'none';
          });
        }
        return wrap;
      };
      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function renderRivalries(el) {
      const r = _data.rivalries || {};
      el.appendChild(buildRivalryCard('⚔️ Most Sixes off a Bowler', r.sixes || [], '6️⃣', 'sixes'));
      el.appendChild(buildRivalryCard('⚔️ Most Fours off a Bowler', r.fours || [], '4️⃣', 'fours'));
      el.appendChild(buildRivalryCard('⚔️ Most Times Dismissed by a Bowler', r.dismissals || [], '🎯', 'dismissals'));
    }

    function buildRivalryCard(title, items, icon, type) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }

      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const suffix = type === 'sixes' ? 'sixes' : type === 'fours' ? 'fours' : 'times';

      const SHOW = 10;
      const makeRivalryRow = (item, i) => {
        const row = document.createElement('div');
        row.className = 'rivalry-row';
        const rankHtml = i < 3
          ? '<span class="rivalry-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="rivalry-rank">' + (i + 1) + '</span>';
        const namesHtml = type === 'dismissals'
          ? '<div class="rivalry-names">' +
              '<div class="rivalry-batter">' + item.bowler + '</div>' +
              '<div class="rivalry-bowler">dismissed ' + item.batter + '</div>' +
            '</div>'
          : '<div class="rivalry-names">' +
              '<div class="rivalry-batter">' + item.batter + '</div>' +
              '<div class="rivalry-bowler">off ' + item.bowler + '</div>' +
            '</div>';
        row.innerHTML = rankHtml + namesHtml +
          '<span class="rivalry-badge">' + item.count + ' ' + suffix + '</span>';
        return row;
      };

      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRivalryRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRivalryRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }
  </script>
