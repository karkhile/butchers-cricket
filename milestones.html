<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchers Cricket — Upcoming Milestones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* card/row classes used by JS — kept as plain CSS so JS doesn't need Tailwind awareness */
    * { box-sizing: border-box; }
    .card, .fastest-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      ring: 1px solid rgba(255,255,255,0.2);
    }
    .card-title { font-size: 14px; font-weight: 700; color: #064e3b; margin-bottom: 14px; font-family: -apple-system, sans-serif; }
    .empty { color: #bbb; font-size: 13px; text-align: center; padding: 10px 0; font-family: -apple-system, sans-serif; }

    .milestone-row { padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-family: -apple-system, sans-serif; }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-row.hot { background: #fffbea; border-radius: 8px; padding: 9px 8px; margin: 2px -8px; }
    .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .player-name { font-size: 13px; font-weight: 600; color: #222; }
    .milestone-row.hot .player-name { color: #a05f00; }
    .gap-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #d1fae5; color: #065f46; white-space: nowrap; }
    .milestone-row.hot .gap-badge { background: #fef3c7; color: #92400e; }
    .progress-wrap { height: 6px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .progress-bar  { height: 6px; border-radius: 4px; min-height: 6px; display: block; }
    .milestone-row.hot .progress-bar { display: block; }
    .row-bottom { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 4px; }

    .achieved-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-family: -apple-system, sans-serif; }
    .achieved-row:last-child { border-bottom: none; }
    .achieved-name { font-size: 13px; font-weight: 600; color: #222; }
    .achieved-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #d1fae5; color: #065f46; white-space: nowrap; }
    .achieved-sub { font-size: 11px; color: #aaa; margin-top: 1px; }

    .view-more-wrap { text-align: center; margin-top: 8px; }
    .view-more-btn { background: none; border: none; color: #059669; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px; }
    .extra-rows { display: none; }
    .extra-rows.open { display: block; }

    .fastest-section { margin-bottom: 16px; font-family: -apple-system, sans-serif; }
    .fastest-section:last-child { margin-bottom: 0; }
    .fastest-threshold { font-size: 12px; font-weight: 700; color: #065f46; background: #d1fae5; border-radius: 8px; padding: 4px 10px; display: inline-block; margin-bottom: 6px; }
    .fastest-entry { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #f5f5f5; font-family: -apple-system, sans-serif; }
    .fastest-entry:last-child { border-bottom: none; }
    .fastest-rank { font-size: 12px; font-weight: 700; color: #888; width: 20px; flex-shrink: 0; }
    .fastest-rank.gold   { color: #f0b429; }
    .fastest-rank.silver { color: #8f9ba8; }
    .fastest-rank.bronze { color: #c17b3d; }
    .fastest-name  { font-size: 13px; font-weight: 600; color: #222; flex: 1; }
    .fastest-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #d1fae5; color: #065f46; white-space: nowrap; }

    .rivalry-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-family: -apple-system, sans-serif; }
    .rivalry-row:last-child { border-bottom: none; }
    .rivalry-rank { font-size: 12px; font-weight: 700; color: #888; width: 22px; flex-shrink: 0; }
    .rivalry-rank.gold   { color: #f0b429; }
    .rivalry-rank.silver { color: #8f9ba8; }
    .rivalry-rank.bronze { color: #c17b3d; }
    .rivalry-names { flex: 1; }
    .rivalry-batter { font-size: 13px; font-weight: 600; color: #222; }
    .rivalry-bowler { font-size: 11px; color: #888; margin-top: 1px; }
    .rivalry-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #d1fae5; color: #065f46; white-space: nowrap; }

    @keyframes navSlideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    @keyframes cardSlideUp {
      from { transform: translateY(28px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }
    @keyframes barFill { from { width: 0; } }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes hotPulse {
      0%, 100% { box-shadow: none; }
      50%       { box-shadow: 0 0 10px 2px rgba(243,156,18,0.45); }
    }
    @keyframes trophyWiggle {
      0%,100% { transform: rotate(0deg); }
      20%     { transform: rotate(-12deg) scale(1.2); }
      40%     { transform: rotate(10deg)  scale(1.15); }
      60%     { transform: rotate(-8deg)  scale(1.1); }
      80%     { transform: rotate(6deg)   scale(1.05); }
    }
    @keyframes medalPop {
      0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
      60%  { transform: scale(1.3) rotate(5deg);  opacity: 1; }
      80%  { transform: scale(0.9) rotate(-2deg); }
      100% { transform: scale(1)   rotate(0deg); }
    }
    @keyframes rowSlideIn {
      from { transform: translateX(-16px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    .nav-animate { animation: navSlideDown 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .card, .fastest-card { animation: cardSlideUp 0.45s cubic-bezier(0.22,1,0.36,1) both; }
    .card:hover, .fastest-card:hover {
      transform: translateY(-4px) rotate3d(1, 0.5, 0, 1.5deg);
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* progress bar: animate fill + shimmer highlight */
    .progress-bar {
      background: linear-gradient(90deg, #2ecc71 0%, #27ae60 40%, #a8f5c8 55%, #27ae60 70%, #2ecc71 100%);
      background-size: 200% 100%;
      animation: barFill 0.7s cubic-bezier(0.22,1,0.36,1) both, shimmer 2.5s linear 0.8s infinite;
    }
    .milestone-row.hot .progress-bar {
      background: linear-gradient(90deg, #f39c12 0%, #e67e22 40%, #ffd97a 55%, #e67e22 70%, #f39c12 100%);
      background-size: 200% 100%;
      animation: barFill 0.7s cubic-bezier(0.22,1,0.36,1) both, shimmer 1.8s linear 0.8s infinite;
    }

    .milestone-row.hot { animation: hotPulse 2s ease-in-out 1s infinite; }
    .milestone-row, .achieved-row, .fastest-entry, .rivalry-row { animation: rowSlideIn 0.35s ease both; }
    .achieved-name .trophy-emoji { display: inline-block; animation: trophyWiggle 0.7s ease both; }

    .fastest-rank.gold, .fastest-rank.silver, .fastest-rank.bronze,
    .rivalry-rank.gold, .rivalry-rank.silver, .rivalry-rank.bronze {
      display: inline-block;
      animation: medalPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
  </style>
</head>

<div class="px-5 py-6 max-w-5xl mx-auto">
  <div class="text-center mb-5">
    <img src="logo.jpg" onerror="this.style.display='none'" alt="" class="w-14 h-14 rounded-full object-cover mx-auto mb-3 shadow-lg ring-4 ring-white/20">
    <h1 class="text-white font-bold text-xl tracking-tight">Milestones</h1>
    <p id="updated-at" class="text-emerald-300 text-xs mt-1">Loading…</p>
  </div>

  <div class="flex justify-center gap-2 mb-5 flex-wrap">
    <button id="btn-big"       onclick="setView('big')"       class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition active">Major upcoming</button>
    <button id="btn-all"       onclick="setView('all')"       class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition inactive">All upcoming</button>
    <button id="btn-achieved"  onclick="setView('achieved')"  class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition inactive">🏆 Achieved</button>
    <button id="btn-fastest"   onclick="setView('fastest')"   class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition inactive">⚡ Fastest</button>
    <button id="btn-rivalries" onclick="setView('rivalries')" class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition inactive">⚔️ Rivalries</button>
    <button id="btn-analysis"  onclick="setView('analysis')"  class="toggle-btn px-4 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer transition inactive">📊 Analysis</button>
  </div>

  <div id="content" class="text-emerald-300 text-center py-10 text-sm">Fetching milestones…</div>
</div>

  <script>
    let _data = null;
    let _view = 'big';

    const CARDS = [
      { key: 'batting',      title: '🏏 Batting',        unit: 'runs',       gap: 'runs needed'      },
      { key: 'fours',        title: '4️⃣  Fours',          unit: 'fours',      gap: 'fours needed'     },
      { key: 'sixes',        title: '6️⃣  Sixes',          unit: 'sixes',      gap: 'sixes needed'     },
      { key: 'bowling',      title: '🔴 Bowling',        unit: 'wkts',       gap: 'wickets needed'   },
      { key: 'totalCatches', title: '🤲 Total Catches',  unit: 'catches',    gap: 'catches needed'   },
      { key: 'catches',      title: '↳ Field Catches',   unit: 'catches',    gap: 'catches needed'   },
      { key: 'keeperCt',     title: '↳ Keeper Catches',  unit: 'catches',    gap: 'catches needed'   },
      { key: 'stumpings',    title: '🪄 Stumpings',      unit: 'stumpings',  gap: 'stumpings needed' },
      { key: 'runOuts',      title: '🏃 Run-Outs',       unit: 'run-outs',   gap: 'run-outs needed'  },
      { key: 'mom',          title: '⭐ Player of Match', unit: 'awards',     gap: 'awards needed'    },
    ];

    fetch('./milestones.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        _data = data;
        const d = new Date(data.updatedAt);
        document.getElementById('updated-at').textContent =
          'Updated ' + d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
        // init toggle styles
        setView(_view);
      })
      .catch(() => {
        document.getElementById('content').className = 'text-red-400 text-center py-10 text-sm';
        document.getElementById('content').textContent = 'Could not load milestones data.';
      });

    function sn(name) {
      const p = (name || '').trim().split(/\s+/);
      return p[0] + (p.length > 1 ? ' ' + p[p.length - 1][0] : '');
    }

    function setView(v) {
      _view = v;
      ['big','all','achieved','fastest','rivalries','analysis'].forEach(k => {
        const btn = document.getElementById('btn-' + k);
        if (v === k) {
          btn.style.background = 'white'; btn.style.color = '#064e3b';
        } else {
          btn.style.background = 'rgba(255,255,255,0.15)'; btn.style.color = '#6ee7b7';
        }
      });
      if (_data) render();
    }

    function render() {
      const el = document.getElementById('content');
      el.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl mx-auto px-5 pb-8';
      el.innerHTML = '';
      if (_view === 'achieved') {
        for (const c of CARDS) {
          const items = (_data[c.key] || {}).achieved || [];
          el.appendChild(buildAchievedCard(c.title, items, c.unit));
        }
      } else if (_view === 'rivalries') {
        renderRivalries(el);
      } else if (_view === 'analysis') {
        renderAnalysis(el);
      } else if (_view === 'fastest') {
        renderFastest(el);
      } else {
        for (const c of CARDS) {
          const items = (_data[c.key] || {})[_view] || [];
          el.appendChild(buildCard(c.title, items, c.unit, c.gap));
        }
      }
      el.querySelectorAll('.card').forEach((c, i) => { c.style.animationDelay = (i * 0.07) + 's'; });
      // stagger rows within each card
      el.querySelectorAll('.card').forEach(c => {
        c.querySelectorAll('.milestone-row, .achieved-row, .fastest-entry, .rivalry-row').forEach((r, j) => {
          r.style.animationDelay = (j * 0.05) + 's';
        });
        c.querySelectorAll('.fastest-rank.gold, .fastest-rank.silver, .fastest-rank.bronze, .rivalry-rank.gold, .rivalry-rank.silver, .rivalry-rank.bronze').forEach((m, j) => {
          m.style.animationDelay = (j * 0.12 + 0.2) + 's';
        });
      });
    }

    function buildCard(title, items, unit, gapLabel) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No upcoming milestones</div>'; return card; }

      const SHOW = 5;
      for (const item of items.slice(0, SHOW)) card.appendChild(makeRow(item, unit, gapLabel));

      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        for (const item of extra) extraWrap.appendChild(makeRow(item, unit, gapLabel));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function buildAchievedCard(title, items, unit) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No milestones achieved yet</div>'; return card; }

      const SHOW = 5;
      for (const item of items.slice(0, SHOW)) card.appendChild(makeAchievedRow(item, unit));

      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        for (const item of extra) extraWrap.appendChild(makeAchievedRow(item, unit));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function makeRow(item, unit, gapLabel) {
      const hot = item.gap <= Math.ceil(item.next * 0.05) || item.gap <= 2;
      const pct = Math.min(99, Math.round(item.current / item.next * 100));
      const row = document.createElement('div');
      row.className = 'milestone-row' + (hot ? ' hot' : '');
      row.innerHTML =
        '<div class="row-top">' +
          '<span class="player-name">' + sn(item.name) + (hot ? ' 🔥' : '') + '</span>' +
          '<span class="gap-badge">' + item.gap + ' ' + gapLabel + '</span>' +
        '</div>' +
        '<div class="progress-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="row-bottom"><span>' + item.current + ' ' + unit + '</span><span>🎯 ' + item.next + ' ' + unit + '</span></div>';
      return row;
    }

    function makeAchievedRow(item, unit) {
      const row = document.createElement('div');
      row.className = 'achieved-row';
      row.innerHTML =
        '<div>' +
          '<div class="achieved-name"><span class="trophy-emoji">🏆</span> ' + sn(item.name) + '</div>' +
          '<div class="achieved-sub">' + item.current + ' ' + unit + ' total</div>' +
        '</div>' +
        '<span class="achieved-badge">✓ ' + item.achieved + ' ' + unit + '</span>';
      return row;
    }

    const FASTEST_CARDS = [
      { key: 'batting',     title: '🏏 Batting',        unit: 'matches', suffix: 'runs'     },
      { key: 'fours',       title: '4️⃣  Fours',          unit: 'matches', suffix: 'fours'    },
      { key: 'sixes',       title: '6️⃣  Sixes',          unit: 'matches', suffix: 'sixes'    },
      { key: 'bowling',     title: '🔴 Bowling',        unit: 'matches', suffix: 'wickets'  },
      { key: 'totalCatch',  title: '🤲 Total Catches',  unit: 'matches', suffix: 'catches'  },
      { key: 'fieldCatch',  title: '↳ Field Catches',   unit: 'matches', suffix: 'catches'  },
      { key: 'keeperCatch', title: '↳ Keeper Catches',  unit: 'matches', suffix: 'catches'  },
      { key: 'stumpings',   title: '🪄 Stumpings',      unit: 'matches', suffix: 'stumpings'},
      { key: 'runOuts',     title: '🏃 Run-Outs',       unit: 'matches', suffix: 'run-outs' },
      { key: 'mom',         title: '⭐ Player of Match', unit: 'matches', suffix: 'awards'   },
    ];

    function buildTopOversCard(topOvers) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">💥 Most Runs in an Over</div>';
      if (!topOvers.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      let displayRank = 0;
      let prevRuns = null;

    function buildRankingHistoryCard(history, timeline, title, subtitle) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + (title || '👑 Rank #1 History') + '</div>' +
        '<div style="font-size:11px;color:#888;margin-bottom:10px;">' + (subtitle || 'Matches each player held the #1 ranking spot.') + '</div>';
      if (!history.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }

      const total = history.reduce((s, r) => s + r.matchCount, 0);
      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const colors = ['#f59e0b','#6b7280','#92400e','#3b82f6','#10b981'];

      history.forEach((r, i) => {
        const pct = Math.round(r.matchCount / total * 100);
        const color = colors[i] || '#94a3b8';
        const row = document.createElement('div');
        row.style.cssText = 'padding:7px 0;border-bottom:1px solid #f0f0f0;';

          : '<span class="fastest-rank">' + (i+1) + '</span>';
        const totalLabel = r.total && r.total !== r.matchCount ? '<span style="font-size:10px;color:#999;margin-left:4px;">(' + r.total + ' total)</span>' : '';
        row.innerHTML =
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' +
            rankHtml +
            '<span style="font-size:13px;font-weight:600;color:#222;flex:1;">' + sn(r.name) + '</span>' +
            '<span style="font-size:11px;font-weight:700;color:' + color + ';">' + r.matchCount + ' matches · ' + pct + '%' + totalLabel + '</span>' +

          '<div style="height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-left:28px;">' +
            '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:4px;transition:width 0.6s ease;"></div>' +

          tl.appendChild(d);

        card.appendChild(tl);
      }
      return card;
    }

        const lowestWp = item.instances.length ? Math.min(...item.instances.map(x => x.lowestWp)) : null;
        const subtleHtml = lowestWp !== null
          ? '<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px;">lowest ' + lowestWp + '%</span>'
          : '';
        row.innerHTML = rankHtml +
          '<span class="fastest-name">' + sn(item.name) + subtleHtml + '</span>' +
          '<span class="fastest-badge" style="background:#e8f5e9;color:#1b5e20;">' + item.count + ' rescue' + (item.count > 1 ? 's' : '') + '</span>';
        wrap.appendChild(row);

        // Instance rows (hidden by default, toggle on click)
        if (item.instances && item.instances.length) {
          const detail = document.createElement('div');
          detail.style.cssText = 'display:none;padding:4px 0 8px 36px;';
          item.instances.forEach(inst => {
            const d = document.createElement('div');
            d.style.cssText = 'font-size:11px;color:#555;padding:4px 0;border-bottom:1px solid #f0f0f0;';
            const situation = inst.type === 'bat'
              ? 'Needed <strong>' + inst.needed + '</strong> off <strong>' + inst.oversLeft + '</strong> overs, <strong>' + inst.wickets + '</strong> wickets down'
              : 'Opposition needed <strong>' + inst.needed + '</strong> off <strong>' + inst.oversLeft + '</strong> overs, <strong>' + inst.wickets + '</strong> wickets down';
            d.innerHTML =
              '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span>' + (inst.date || '') + ' · ' + (inst.type === 'bowl' ? '🎳 defending' : '🏏 chasing') + ' · win% was <strong style="color:#c0392b;">' + inst.lowestWp + '%</strong> → won</span>' +
                '<span style="color:#1b5e20;font-weight:600;white-space:nowrap;margin-left:8px;">+' + inst.rescueWpa.toFixed(2) + ' WPA</span>' +
              '</div>' +
              (inst.needed !== undefined ? '<div style="color:#888;margin-top:2px;">' + situation + '</div>' : '') +
              (inst.contributed ? '<div style="color:#1b5e20;font-size:11px;margin-top:2px;">Contributed: ' + inst.contributed + '</div>' : '');
            detail.appendChild(d);
          });
          wrap.appendChild(detail);
          row.addEventListener('click', () => {
            const open = detail.style.display === 'none';
            detail.style.display = open ? 'block' : 'none';
          });
        }
        return wrap;
      };
      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }

    function renderRivalries(el) {
      el.appendChild(buildCaptainCard(_data.captainStats || []));
      const r = _data.rivalries || {};
      el.appendChild(buildRivalryCard('⚔️ Most Sixes off a Bowler', r.sixes || [], '6️⃣', 'sixes'));
      el.appendChild(buildRivalryCard('⚔️ Most Fours off a Bowler', r.fours || [], '4️⃣', 'fours'));
      el.appendChild(buildRivalryCard('⚔️ Most Times Dismissed by a Bowler', r.dismissals || [], '🎯', 'dismissals'));
    }

    function buildRivalryCard(title, items, icon, type) {
      const card = document.createElement('div');
      card.className = 'fastest-card';
      card.innerHTML = '<div class="card-title">' + title + '</div>';
      if (!items.length) { card.innerHTML += '<div class="empty">No data yet</div>'; return card; }

      const rankLabels = ['🥇','🥈','🥉'];
      const rankClasses = ['gold','silver','bronze'];
      const suffix = type === 'sixes' ? 'sixes' : type === 'fours' ? 'fours' : 'times';

      const SHOW = 10;
      const makeRivalryRow = (item, i) => {
        const row = document.createElement('div');
        row.className = 'rivalry-row';
        const rankHtml = i < 3
          ? '<span class="rivalry-rank ' + rankClasses[i] + '">' + rankLabels[i] + '</span>'
          : '<span class="rivalry-rank">' + (i + 1) + '</span>';
        const namesHtml = type === 'dismissals'
          ? '<div class="rivalry-names">' +
              '<div class="rivalry-batter">' + sn(item.bowler) + '</div>' +
              '<div class="rivalry-bowler">dismissed ' + sn(item.batter) + '</div>' +
            '</div>'
          : '<div class="rivalry-names">' +
              '<div class="rivalry-batter">' + sn(item.batter) + '</div>' +
              '<div class="rivalry-bowler">off ' + sn(item.bowler) + '</div>' +
            '</div>';
        row.innerHTML = rankHtml + namesHtml +
          '<span class="rivalry-badge">' + item.count + ' ' + suffix + '</span>';
        return row;
      };

      for (const [i, item] of items.slice(0, SHOW).entries()) card.appendChild(makeRivalryRow(item, i));
      const extra = items.slice(SHOW);
      if (extra.length) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'extra-rows';
        extra.forEach((item, j) => extraWrap.appendChild(makeRivalryRow(item, SHOW + j)));
        card.appendChild(extraWrap);
        const btnWrap = document.createElement('div');
        btnWrap.className = 'view-more-wrap';
        const btn = document.createElement('button');
        btn.className = 'view-more-btn';
        btn.textContent = '+ ' + extra.length + ' more';
        btn.onclick = () => { const open = extraWrap.classList.toggle('open'); btn.textContent = open ? '− Show less' : '+ ' + extra.length + ' more'; };
        btnWrap.appendChild(btn);
        card.appendChild(btnWrap);
      }
      return card;
    }
  </script>
</body>
</html>
