<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com https://core-prod-origin.cricclubs.com; style-src 'self' 'unsafe-inline';">
  <title>Butchers Cricket — Game Day Poll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a3d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .emoji { font-size: 48px; }
    .logo h1 { font-size: 22px; font-weight: 700; color: #0a3d1f; margin-top: 8px; }
    .logo p { font-size: 14px; color: #666; margin-top: 4px; }

    .greeting {
      background: #f0faf4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }
    .greeting h2 { font-size: 18px; color: #0a3d1f; font-weight: 600; }
    .greeting p { font-size: 13px; color: #555; margin-top: 4px; }

    .question { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .hint { font-size: 12px; color: #888; margin-bottom: 14px; }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      background: white;
      color: #333;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }
    .option-btn:hover { border-color: #0a3d1f; background: #f0faf4; }
    .option-btn.selected { border-color: #0a3d1f; background: #0a3d1f; color: white; }
    .option-btn.unavailable-btn.selected { border-color: #c0392b; background: #c0392b; }
    .option-btn .icon { font-size: 24px; }
    .option-btn .label { flex: 1; }
    .option-btn .check { font-size: 18px; opacity: 0; }
    .option-btn.selected .check { opacity: 1; }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #0a3d1f;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit-btn:hover { background: #0d5229; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    .success { text-align: center; padding: 20px 0; }
    .success .big { font-size: 56px; }
    .success h2 { font-size: 22px; font-weight: 700; color: #0a3d1f; margin-top: 12px; }
    .success p { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }
    .success .vote-summary {
      margin-top: 16px;
      background: #f0faf4;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #333;
      line-height: 1.8;
    }

    .dashboard {
      margin-top: 20px;
      background: #f9f9f9;
      border-radius: 14px;
      padding: 16px;
      text-align: left;
    }
    .dashboard h3 { font-size: 13px; font-weight: 700; color: #0a3d1f; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .dash-group { margin-bottom: 14px; }
    .dash-group:last-child { margin-bottom: 0; }
    .dash-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #444; }
    .dash-group-count { background: #0a3d1f; color: white; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .player-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .player-pill { background: white; border: 1.5px solid #d0e8d8; border-radius: 20px; padding: 4px 10px; font-size: 12px; color: #0a3d1f; font-weight: 500; }

    .error-msg {
      background: #fff0f0;
      color: #c0392b;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .unknown-player { text-align: center; padding: 20px 0; }
    .unknown-player .big { font-size: 48px; }
    .unknown-player h2 { font-size: 20px; font-weight: 700; color: #333; margin-top: 12px; }
    .unknown-player p { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }

    .poll-closed { text-align: center; padding: 20px 0; }
    .poll-closed .big { font-size: 48px; }
    .poll-closed h2 { font-size: 20px; font-weight: 700; color: #0a3d1f; margin-top: 12px; }
    .poll-closed p { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card" id="app">
  <div class="logo">
    <img src="logo.jpg" alt="Butchers Cricket" style="width:96px;height:96px;border-radius:50%;object-fit:cover;">
    <h1>Butchers Cricket</h1>
    <p>Weekly Game Day Poll</p>
  </div>
  <div id="content">Loading...</div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDU0RHh9ScIIPE5tSpjjhnAPN8ypF5T9EE",
    authDomain: "butchers-cricket.firebaseapp.com",
    projectId: "butchers-cricket",
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);

  function nextSaturday() {
    const now = new Date();
    const day = now.getDay();
    // Sat: stay on today. Sun: jump to next Sat. Mon-Fri: this coming Sat.
    const daysUntilSat = day === 6 ? 0 : day === 0 ? 6 : (6 - day);
    const sat = new Date(now); sat.setDate(now.getDate() + daysUntilSat);
    return sat;
  }

  function getUpcomingDates() {
    if (window._pollDates) return window._pollDates;
    const sat = nextSaturday();
    const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    const mon = new Date(sat); mon.setDate(sat.getDate() + 2);
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return { fri: fmt(fri), sat: fmt(sat), sun: fmt(sun), mon: fmt(mon), extraDates: [] };
  }

  function getWeekKey() {
    if (window._pollWeekKey) return window._pollWeekKey;
    return nextSaturday().toISOString().slice(0, 10);
  }

  function formatVoteSummary(days, fri, sat, sun, mon) {
    if (!days || days.length === 0) return '❌ Not Available';
    const labels = { friday: '📅 Friday, ' + fri, saturday: '📅 Saturday, ' + sat, sunday: '📅 Sunday, ' + sun, monday: '📅 Monday, ' + mon };
    return days.map(d => labels[d] || d).join('<br>');
  }

  function getDays(v) {
    if (v.days !== undefined) return v.days;
    if (v.vote === 'both') return ['saturday', 'sunday'];
    if (v.vote === 'unavailable') return [];
    if (v.vote) return [v.vote];
    return [];
  }

  async function showSuccess(name, days, voteRef, weekKey) {
    const { fri, sat, sun, mon } = getUpcomingDates();
    const unavailable = !days || days.length === 0;
    document.getElementById('content').innerHTML = `
      <div class="success">
        <div class="big">${unavailable ? '😢' : '🎉'}</div>
        <h2>${unavailable ? 'Thanks for letting us know!' : "You're in!"}</h2>
        <p>${unavailable
          ? 'Hope to see you next week, ' + name.split(' ')[0] + '!'
          : 'See you on the field, ' + name.split(' ')[0] + '! 🏏'
        }</p>
        <div class="vote-summary">Your availability:<br><strong>${formatVoteSummary(days, fri, sat, sun, mon)}</strong></div>
        <div class="dashboard" id="dashboard"><h3>📊 Loading poll results...</h3></div>
        <button class="submit-btn" id="changeBtn" style="margin-top:16px;background:#666;font-size:14px;padding:12px">✏️ Change my vote</button>
        <button class="submit-btn" id="undoBtn" style="margin-top:8px;background:white;color:#c0392b;border:2px solid #c0392b;font-size:14px;padding:12px">🗑️ Undo — I'll decide later</button>
      </div>`;
    document.getElementById('changeBtn').addEventListener('click', () => showVoteForm(name, voteRef, weekKey, days));
    document.getElementById('undoBtn').addEventListener('click', async () => {
      if (!confirm('Remove your vote? You can always vote again later.')) return;
      await deleteDoc(voteRef);
      showVoteForm(name, voteRef, weekKey, null);
    });
    renderDashboard('dashboard', weekKey);
  }

  async function renderDashboard(containerId, weekKey) {
    const { fri, sat, sun, mon, extraDates } = getUpcomingDates();
    try {
      const snap = await getDocs(collection(db, 'votes'));
      const groups = { friday: [], saturday: [], sunday: [], monday: [], unavailable: [] };
      let total = 0;
      snap.forEach(d => {
        const v = d.data();
        if (v.week !== weekKey) return;
        total++;
        const vdays = getDays(v);
        const parts = (v.player || d.id).trim().split(/\s+/);
        const firstName = parts[0] + (parts.length > 1 ? ' ' + parts[parts.length - 1][0] : '');
        if (vdays.length === 0) groups.unavailable.push(firstName);
        if (vdays.includes('friday'))   groups.friday.push(firstName);
        if (vdays.includes('saturday')) groups.saturday.push(firstName);
        if (vdays.includes('sunday'))   groups.sunday.push(firstName);
        if (vdays.includes('monday'))   groups.monday.push(firstName);
      });
      const renderGroup = (label, icon, names) => {
        const pills = names.map(n => `<span class="player-pill">${n}</span>`).join('');
        return `<div class="dash-group">
          <div class="dash-group-header"><span>${icon} ${label}</span><span class="dash-group-count">${names.length}</span></div>
          <div class="player-pills">${pills || '<span style="color:#aaa;font-size:12px">No responses yet</span>'}</div>
        </div>`;
      };
      const hasFri = (extraDates||[]).includes('friday');
      const hasMon = (extraDates||[]).includes('monday');
      document.getElementById(containerId).innerHTML = `
        <h3>📊 Who's playing this week? (${total} responded)</h3>
        ${hasFri ? renderGroup('Friday, '   + fri, '📅', groups.friday)   : ''}
        ${renderGroup('Saturday, ' + sat, '📅', groups.saturday)}
        ${renderGroup('Sunday, '   + sun, '📅', groups.sunday)}
        ${hasMon ? renderGroup('Monday, '   + mon, '📅', groups.monday)   : ''}
        ${renderGroup('Not Available', '❌', groups.unavailable)}`;
    } catch(e) {
      document.getElementById(containerId).innerHTML = '';
    }
  }

  function showVoteForm(name, voteRef, weekKey, currentDays) {
    const { fri, sat, sun, mon, extraDates } = getUpcomingDates();
    // selected is a Set of day keys, or empty = unavailable
    const selected = new Set(currentDays && currentDays.length ? currentDays : []);
    let unavailable = !currentDays || currentDays.length === 0;
    if (currentDays === null) unavailable = false; // fresh vote — nothing pre-selected

    const dayCount = 2 + (extraDates||[]).length;
    document.getElementById('content').innerHTML = `
      <div class="greeting">
        <h2>Hey ${name.split(' ')[0]}! 👋</h2>
        <p>Can you play this weekend?</p>
      </div>
      <div class="question">Select the days you can play:</div>
      <div class="hint">You can select multiple days</div>
      <div class="options" id="options"></div>
      <button class="submit-btn" id="submitBtn" disabled>Submit Vote</button>
      <div class="error-msg" id="errorMsg">Something went wrong. Please try again.</div>
      <div class="dashboard" id="dashboard"><h3>📊 Loading who's playing...</h3></div>
    `;

    const days = [];
    if ((extraDates||[]).includes('friday'))  days.push({ value: 'friday',   label: 'Friday, '   + fri, icon: '📅' });
    days.push({ value: 'saturday', label: 'Saturday, ' + sat, icon: '📅' });
    days.push({ value: 'sunday',   label: 'Sunday, '   + sun, icon: '📅' });
    if ((extraDates||[]).includes('monday'))  days.push({ value: 'monday',   label: 'Monday, '   + mon, icon: '📅' });

    const updateSubmit = () => {
      document.getElementById('submitBtn').disabled = (!unavailable && selected.size === 0);
    };

    days.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (selected.has(opt.value) ? ' selected' : '');
      btn.dataset.value = opt.value;
      btn.innerHTML = `<span class="icon">${opt.icon}</span><span class="label">${opt.label}</span><span class="check">✓</span>`;
      btn.addEventListener('click', () => {
        if (selected.has(opt.value)) {
          selected.delete(opt.value);
          btn.classList.remove('selected');
        } else {
          selected.add(opt.value);
          btn.classList.add('selected');
          unavailable = false;
          naBtn.classList.remove('selected');
        }
        updateSubmit();
      });
      document.getElementById('options').appendChild(btn);
    });

    // Not Available button
    const naBtn = document.createElement('button');
    naBtn.className = 'option-btn unavailable-btn' + (unavailable ? ' selected' : '');
    naBtn.innerHTML = `<span class="icon">❌</span><span class="label">Not Available</span><span class="check">✓</span>`;
    naBtn.addEventListener('click', () => {
      unavailable = !unavailable;
      if (unavailable) {
        selected.clear();
        document.querySelectorAll('.option-btn:not(.unavailable-btn)').forEach(b => b.classList.remove('selected'));
        naBtn.classList.add('selected');
      } else {
        naBtn.classList.remove('selected');
      }
      updateSubmit();
    });
    document.getElementById('options').appendChild(naBtn);

    // pre-set submit state
    if (currentDays !== null) updateSubmit();

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      const daysArr = unavailable ? [] : [...selected];
      try {
        await setDoc(voteRef, { player: name, days: daysArr, week: weekKey, timestamp: Date.now() });
        await showSuccess(name, daysArr, voteRef, weekKey);
      } catch(e) {
        document.getElementById('errorMsg').style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Vote';
      }
    });

    renderDashboard('dashboard', weekKey);
  }

  (async () => {
    const params     = new URLSearchParams(window.location.search);
    const playerName = params.get('player');
    const content    = document.getElementById('content');

    if (!playerName) {
      content.innerHTML = `
        <div class="unknown-player">
          <div class="big">🤔</div>
          <h2>Who are you?</h2>
          <p>Please use the personal link shared in the WhatsApp group to vote.</p>
        </div>`;
      return;
    }

    // Check Firestore for poll open/closed state and game date
    let pollOpen = true;
    let pollSatDate = null;
    let pollExtraDates = [];
    try {
      const pollSnap = await getDoc(doc(db, 'config', 'poll'));
      if (pollSnap.exists()) {
        const pd = pollSnap.data();
        pollOpen = pd.open !== false;
        if (pd.satDate) pollSatDate = pd.satDate; // YYYY-MM-DD
        if (pd.extraDates) pollExtraDates = pd.extraDates; // ['friday'] or ['monday'] or both
      }
    } catch(e) {}

    // Override upcoming dates with admin-set date if available
    if (pollSatDate) {
      const sat = new Date(pollSatDate + 'T12:00:00');
      const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
      const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
      const mon = new Date(sat); mon.setDate(sat.getDate() + 2);
      const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      window._pollDates = {
        fri: fmt(fri), sat: fmt(sat), sun: fmt(sun), mon: fmt(mon),
        extraDates: pollExtraDates,
      };
      window._pollWeekKey = pollSatDate;
    }

    if (!pollOpen) {
      content.innerHTML = `
        <div class="poll-closed">
          <div class="big">🔒</div>
          <h2>Poll is closed</h2>
          <p>Check back later for next week's poll.<br>See you on the field, ${playerName.split(' ')[0]}! 🏏</p>
        </div>`;
      return;
    }

    const weekKey = getWeekKey();
    const voteRef = doc(db, 'votes', playerName);

    try {
      const snap = await getDoc(voteRef);
      if (snap.exists() && snap.data().week === weekKey) {
        const data = snap.data();
        // support old single-value votes
        const days = data.days !== undefined ? data.days : (data.vote && data.vote !== 'unavailable' ? [data.vote === 'both' ? ['saturday','sunday'] : data.vote].flat() : []);
        await showSuccess(playerName, days, voteRef, weekKey);
        return;
      }
    } catch(e) {}

    showVoteForm(playerName, voteRef, weekKey, null);
  })();
</script>
</body>
</html>
