    tailwind.config = {
      theme: {
        extend: {
          colors: {

          },
          backdropBlur: { xs: '2px' }
        }
      }
    }

  <style>
    @keyframes navSlideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    @keyframes cardBounceIn {
      0%   { transform: translateY(40px) scale(0.95); opacity: 0; }
      60%  { transform: translateY(-8px) scale(1.02); opacity: 1; }
      80%  { transform: translateY(4px)  scale(0.99); }
      100% { transform: translateY(0)    scale(1); }
    }
    @keyframes optionSlideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    @keyframes tada {
      0%   { transform: scale(1); }
      10%  { transform: scale(0.9) rotate(-3deg); }
      20%  { transform: scale(0.9) rotate(-3deg); }
      30%  { transform: scale(1.1) rotate(3deg); }
      40%  { transform: scale(1.1) rotate(-3deg); }
      50%  { transform: scale(1.1) rotate(3deg); }
      60%  { transform: scale(1.1) rotate(-3deg); }
      70%  { transform: scale(1.1) rotate(3deg); }
      80%  { transform: scale(1.1) rotate(-3deg); }
      90%  { transform: scale(1.1) rotate(3deg); }
      100% { transform: scale(1)   rotate(0); }
    }
    .nav-animate  { animation: navSlideDown 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .card-animate { animation: cardBounceIn 0.55s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    .option-animate { animation: optionSlideIn 0.3s ease both; }
    .tada-animate { animation: tada 0.8s ease 0.2s both; }
  </style>
</head>

<div class="flex-1 flex items-center justify-center p-5">
  <div id="app" class="card-animate bg-white/95 backdrop-blur-sm rounded-3xl p-8 w-full max-w-md shadow-2xl ring-1 ring-white/20">
    <div class="text-center mb-6">
      <img src="logo.jpg" alt="Butchers Cricket" class="w-24 h-24 rounded-full object-cover mx-auto shadow-lg ring-4 ring-emerald-100">
      <h1 class="text-emerald-900 font-bold text-xl mt-3 tracking-tight">Butchers Cricket</h1>
      <p class="text-gray-400 text-xs mt-1">Weekly Game Day Poll</p>
    </div>
    <div id="content" class="text-gray-500 text-sm text-center">Loading...</div>
  </div>
</div>

<script src="roster.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDU0RHh9ScIIPE5tSpjjhnAPN8ypF5T9EE",
    authDomain: "butchers-cricket.firebaseapp.com",
    projectId: "butchers-cricket",
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);

  function nextSaturday() {
    const now = new Date();
    const day = now.getDay();
    const daysUntilSat = day === 6 ? 0 : day === 0 ? 6 : (6 - day);
    const sat = new Date(now); sat.setDate(now.getDate() + daysUntilSat);
    return sat;
  }

  function getUpcomingDates() {
    if (window._pollDates) return window._pollDates;
    const sat = nextSaturday();
    const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    const mon = new Date(sat); mon.setDate(sat.getDate() + 2);
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return { fri: fmt(fri), sat: fmt(sat), sun: fmt(sun), mon: fmt(mon), extraDates: [] };
  }

  function getWeekKey() {
    if (window._pollWeekKey) return window._pollWeekKey;
    return nextSaturday().toISOString().slice(0, 10);
  }

  function formatVoteSummary(days, fri, sat, sun, mon) {
    if (!days || days.length === 0) return '❌ Not Available';
    const labels = { friday: '📅 Friday, ' + fri, saturday: '📅 Saturday, ' + sat, sunday: '📅 Sunday, ' + sun, monday: '📅 Monday, ' + mon };
    return days.map(d => labels[d] || d).join('<br>');
  }

  function getDays(v) {
    if (v.days !== undefined) return v.days;
    if (v.vote === 'both') return ['saturday', 'sunday'];
    if (v.vote === 'unavailable') return [];
    if (v.vote) return [v.vote];
    return [];
  }

  function sanitizeName(name) {
    return (name || '').replace(/[<>"&]/g, '').trim();
  }

  async function showSuccess(name, days, voteRef, weekKey) {
    const { fri, sat, sun, mon } = getUpcomingDates();
    const unavailable = !days || days.length === 0;
    document.getElementById('content').innerHTML = `
      <div class="text-center py-4">
        <div class="tada-animate text-6xl mb-3">${unavailable ? '😢' : '🎉'}</div>
        <h2 class="text-xl font-bold text-emerald-900">${unavailable ? 'Thanks for letting us know!' : "You're in!"}</h2>
        <p class="text-gray-500 text-sm mt-2">${unavailable
          ? 'Hope to see you next week, ' + name.split(' ')[0] + '!'
          : 'See you on the field, ' + name.split(' ')[0] + '! 🏏'
        }</p>
        <div class="mt-4 bg-gradient-to-r from-emerald-50 to-green-50 border border-emerald-100 rounded-2xl p-4 text-sm text-gray-700 leading-relaxed">
          Your availability:<br><strong>${formatVoteSummary(days, fri, sat, sun, mon)}</strong>
        </div>
        <div id="dashboard" class="mt-4 bg-gray-50 rounded-2xl p-4 text-left">
          <p class="text-xs font-bold text-emerald-800 uppercase tracking-wide">📊 Loading poll results...</p>
        </div>
        <button id="changeBtn" class="mt-4 w-full py-3 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-2xl text-sm transition hover:-translate-y-0.5 hover:shadow-lg">✏️ Change my vote</button>
        <button id="undoBtn"   class="mt-2 w-full py-3 bg-white border-2 border-red-300 text-red-500 hover:bg-red-50 font-semibold rounded-2xl text-sm transition">🗑️ Undo — I'll decide later</button>
      </div>`;
    document.getElementById('changeBtn').addEventListener('click', () => showVoteForm(name, voteRef, weekKey, days));
    document.getElementById('undoBtn').addEventListener('click', async () => {
      if (!confirm('Remove your vote? You can always vote again later.')) return;
      await deleteDoc(voteRef);
      showVoteForm(name, voteRef, weekKey, null);
    });
    renderDashboard('dashboard', weekKey);
  }

  async function renderDashboard(containerId, weekKey) {
    const { fri, sat, sun, mon, extraDates } = getUpcomingDates();
    try {
      const snap = await getDocs(collection(db, 'votes'));
      const groups = { friday: [], saturday: [], sunday: [], monday: [], unavailable: [] };
      let total = 0;
      snap.forEach(d => {
        const v = d.data();
        if (v.week !== weekKey) return;
        total++;
        const vdays = getDays(v);
        const parts = (v.player || d.id).trim().split(/\s+/);
        const firstName = parts[0] + (parts.length > 1 ? ' ' + parts[parts.length - 1][0] : '');
        if (vdays.length === 0) groups.unavailable.push(firstName);
        if (vdays.includes('friday'))   groups.friday.push(firstName);
        if (vdays.includes('saturday')) groups.saturday.push(firstName);
        if (vdays.includes('sunday'))   groups.sunday.push(firstName);
        if (vdays.includes('monday'))   groups.monday.push(firstName);
      });
      const renderGroup = (label, icon, names) => {
        const pills = names.map(n => `<span class="inline-block bg-white border border-emerald-200 text-emerald-800 text-xs font-medium px-2.5 py-1 rounded-full">${n}</span>`).join('');
        return `<div class="mb-3">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-semibold text-gray-600">${icon} ${label}</span>
            <span class="text-xs font-bold bg-emerald-700 text-white px-2 py-0.5 rounded-full">${names.length}</span>
          </div>
          <div class="flex flex-wrap gap-1.5">${pills || '<span class="text-xs text-gray-400 italic">No responses yet</span>'}</div>
        </div>`;
      };
      const hasFri = (extraDates||[]).includes('friday');
      const hasMon = (extraDates||[]).includes('monday');
      document.getElementById(containerId).innerHTML = `
        <p class="text-xs font-bold text-emerald-800 uppercase tracking-wide mb-3">📊 Who's playing this week? (${total} responded)</p>
        ${hasFri ? renderGroup('Friday, '   + fri, '📅', groups.friday)   : ''}
        ${renderGroup('Saturday, ' + sat, '📅', groups.saturday)}
        ${renderGroup('Sunday, '   + sun, '📅', groups.sunday)}
        ${hasMon ? renderGroup('Monday, '   + mon, '📅', groups.monday)   : ''}
        ${renderGroup('Not Available', '❌', groups.unavailable)}`;
    } catch(e) {
      document.getElementById(containerId).innerHTML = '';
    }
  }

  function showVoteForm(name, voteRef, weekKey, currentDays) {
    const { fri, sat, sun, mon, extraDates } = getUpcomingDates();
    const selected = new Set(currentDays && currentDays.length ? currentDays : []);
    let unavailable = !currentDays || currentDays.length === 0;
    if (currentDays === null) unavailable = false;

    document.getElementById('content').innerHTML = `
      <div class="bg-gradient-to-r from-emerald-50 to-green-50 border border-emerald-100 rounded-2xl p-4 mb-5 text-center">
        <h2 class="text-emerald-800 font-bold text-base">Hey ${name.split(' ')[0]}! 👋</h2>
        <p class="text-gray-500 text-xs mt-1">Can you play this weekend?</p>
      </div>
      <button id="switchLink" class="block text-right text-xs text-gray-400 hover:text-gray-600 underline underline-offset-2 w-full mb-4 -mt-2 transition">Not you? Switch</button>
      <p class="text-sm font-semibold text-gray-700 mb-1">Select the days you can play:</p>
      <p class="text-xs text-gray-400 mb-3">You can select multiple days</p>
      <div id="options" class="flex flex-col gap-2.5"></div>
      <button id="submitBtn" disabled class="mt-5 w-full py-3.5 bg-gradient-to-r from-emerald-600 to-green-700 text-white font-bold rounded-2xl text-sm shadow-lg transition hover:-translate-y-0.5 hover:shadow-emerald-500/30 disabled:opacity-40 disabled:cursor-not-allowed disabled:translate-y-0 disabled:shadow-none">Submit Vote</button>
      <div id="errorMsg" class="hidden mt-3 bg-red-50 border border-red-200 text-red-600 rounded-xl p-3 text-xs">Something went wrong. Please try again.</div>
      <div id="dashboard" class="mt-4 bg-gray-50 rounded-2xl p-4 text-left">
        <p class="text-xs font-bold text-emerald-800 uppercase tracking-wide">📊 Loading who's playing...</p>
      </div>
    `;

    document.getElementById('switchLink').addEventListener('click', () => {
      localStorage.removeItem('playerName');
      location.reload();
    });

    const days = [];
    if ((extraDates||[]).includes('friday'))  days.push({ value: 'friday',   label: 'Friday, '   + fri, icon: '📅' });
    days.push({ value: 'saturday', label: 'Saturday, ' + sat, icon: '📅' });
    days.push({ value: 'sunday',   label: 'Sunday, '   + sun, icon: '📅' });
    if ((extraDates||[]).includes('monday'))  days.push({ value: 'monday',   label: 'Monday, '   + mon, icon: '📅' });

    const updateSubmit = () => {
      document.getElementById('submitBtn').disabled = (!unavailable && selected.size === 0);
    };

    days.forEach(opt => {
      const btn = document.createElement('button');
      const isSelected = selected.has(opt.value);
      btn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition ' +
        (isSelected
          ? 'border-emerald-600 bg-gradient-to-r from-emerald-600 to-green-700 text-white shadow-md'
          : 'border-gray-100 bg-white text-gray-700 hover:border-emerald-300 hover:bg-emerald-50');
      btn.dataset.value = opt.value;
      btn.innerHTML = `<span class="text-base">${opt.icon}</span><span class="flex-1">${opt.label}</span><span class="text-sm opacity-0 ${isSelected ? '!opacity-100' : ''}">✓</span>`;
      btn.addEventListener('click', () => {
        if (selected.has(opt.value)) {
          selected.delete(opt.value);
          btn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-gray-100 bg-white text-gray-700 hover:border-emerald-300 hover:bg-emerald-50';
          btn.querySelector('span:last-child').style.opacity = '0';
        } else {
          selected.add(opt.value);
          btn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-emerald-600 bg-gradient-to-r from-emerald-600 to-green-700 text-white shadow-md';
          btn.querySelector('span:last-child').style.opacity = '1';
          unavailable = false;
          naBtn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-gray-100 bg-white text-gray-700 hover:border-red-200 hover:bg-red-50';
          naBtn.querySelector('span:last-child').style.opacity = '0';
        }
        updateSubmit();
      });
      btn.style.animationDelay = (days.indexOf(opt) * 0.07) + 's';
      document.getElementById('options').appendChild(btn);
    });

    const naBtn = document.createElement('button');
    naBtn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition ' +
      (unavailable
        ? 'border-red-500 bg-gradient-to-r from-red-500 to-red-600 text-white shadow-md'
        : 'border-gray-100 bg-white text-gray-700 hover:border-red-200 hover:bg-red-50');
    naBtn.innerHTML = `<span class="text-base">❌</span><span class="flex-1">Not Available</span><span class="text-sm ${unavailable ? '' : 'opacity-0'}">✓</span>`;
    naBtn.addEventListener('click', () => {
      unavailable = !unavailable;
      if (unavailable) {
        selected.clear();
        document.querySelectorAll('#options button:not(:last-child)').forEach(b => {
          b.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-gray-100 bg-white text-gray-700 hover:border-emerald-300 hover:bg-emerald-50';
          b.querySelector('span:last-child').style.opacity = '0';
        });
        naBtn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-red-500 bg-gradient-to-r from-red-500 to-red-600 text-white shadow-md';
        naBtn.querySelector('span:last-child').style.opacity = '1';
      } else {
        naBtn.className = 'option-animate flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 text-left text-sm font-medium transition border-gray-100 bg-white text-gray-700 hover:border-red-200 hover:bg-red-50';
        naBtn.querySelector('span:last-child').style.opacity = '0';
      }
      updateSubmit();
    });
    naBtn.style.animationDelay = (days.length * 0.07) + 's';
    document.getElementById('options').appendChild(naBtn);

    if (currentDays !== null) updateSubmit();

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      const daysArr = unavailable ? [] : [...selected];
      try {
        await setDoc(voteRef, { player: name, days: daysArr, week: weekKey, timestamp: Date.now() });
        await showSuccess(name, daysArr, voteRef, weekKey);
      } catch(e) {
        document.getElementById('errorMsg').classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Vote';
      }
    });

    renderDashboard('dashboard', weekKey);
  }

  (async () => {
    const params  = new URLSearchParams(window.location.search);
    const content = document.getElementById('content');

    let playerName = sanitizeName(params.get('player'));
    if (playerName) {
      if (ROSTER_NAMES.includes(playerName)) {
        localStorage.setItem('playerName', playerName);
      } else {
        playerName = '';
      }
    }
    if (!playerName) {
      playerName = sanitizeName(localStorage.getItem('playerName'));
      if (!ROSTER_NAMES.includes(playerName)) playerName = '';
    }

    if (!playerName) {
      content.innerHTML = `
        <div class="text-center py-2">
          <div class="text-5xl mb-3">🏏</div>
          <h2 class="text-xl font-bold text-emerald-900">Who are you?</h2>
          <p class="text-gray-400 text-sm mt-1 mb-4">Start typing your name</p>
          <input list="rosterList" id="namePicker" placeholder="Type your name…" autocomplete="off"
            class="w-full px-4 py-3 border-2 border-emerald-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition mb-3">
          <datalist id="rosterList">
            ${ROSTER_NAMES.map(n => `<option value="${n}">`).join('')}
          </datalist>
          <button id="goBtn" disabled
            class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-green-700 text-white font-bold rounded-2xl text-sm shadow-lg transition hover:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:translate-y-0">
            Let's go 🏏
          </button>
        </div>`;
      const inp = document.getElementById('namePicker');
      const btn = document.getElementById('goBtn');
      inp.addEventListener('input', () => { btn.disabled = !ROSTER_NAMES.includes(inp.value); });
      btn.addEventListener('click', () => {
        if (!ROSTER_NAMES.includes(inp.value)) return;
        localStorage.setItem('playerName', inp.value);
        location.reload();
      });
      return;
    }

    let pollOpen = true;
    let pollSatDate = null;
    let pollExtraDates = [];
    try {
      const pollSnap = await getDoc(doc(db, 'config', 'poll'));
      if (pollSnap.exists()) {
        const pd = pollSnap.data();
        pollOpen = pd.open !== false;
        if (pd.satDate) pollSatDate = pd.satDate;
        if (pd.extraDates) pollExtraDates = pd.extraDates;
      }
    } catch(e) {}

    if (pollSatDate) {
      const sat = new Date(pollSatDate + 'T12:00:00');
      const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
      const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
      const mon = new Date(sat); mon.setDate(sat.getDate() + 2);
      const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      window._pollDates = { fri: fmt(fri), sat: fmt(sat), sun: fmt(sun), mon: fmt(mon), extraDates: pollExtraDates };
      window._pollWeekKey = pollSatDate;
    }

    if (!pollOpen) {
      content.innerHTML = `
        <div class="text-center py-6">
          <div class="text-5xl mb-3">🔒</div>
          <h2 class="text-xl font-bold text-emerald-900">Poll is closed</h2>
          <p class="text-gray-500 text-sm mt-2">Check back later for next week's poll.<br>See you on the field, ${playerName.split(' ')[0]}! 🏏</p>
        </div>`;
      return;
    }

    const weekKey = getWeekKey();
    const voteRef = doc(db, 'votes', playerName);

    try {
      const snap = await getDoc(voteRef);
      if (snap.exists() && snap.data().week === weekKey) {
        const data = snap.data();
        const days = data.days !== undefined ? data.days : (data.vote && data.vote !== 'unavailable' ? [data.vote === 'both' ? ['saturday','sunday'] : data.vote].flat() : []);
        await showSuccess(playerName, days, voteRef, weekKey);
        return;
      }
    } catch(e) {}

    showVoteForm(playerName, voteRef, weekKey, null);
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
