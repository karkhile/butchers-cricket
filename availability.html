      60%  { transform: translateY(-6px) scale(1.02); opacity: 1; }
      80%  { transform: translateY(3px)  scale(0.99); }

      from { transform: scale(0.6); opacity: 0; }

<div class="px-5 py-6 max-w-4xl mx-auto">
  <div class="text-center mb-6">
    <img src="logo.jpg" alt="Butchers Cricket" class="w-14 h-14 rounded-full object-cover mx-auto mb-3 shadow-lg ring-4 ring-white/20">
    <h1 class="text-white font-bold text-xl tracking-tight">Butchers Cricket</h1>
    <p id="weekLabel" class="text-emerald-300 text-xs mt-1">Loading availability...</p>
  </div>

  <div id="root" class="text-white text-center py-10 text-sm">Loading...</div>
  <p id="updatedAt" class="text-center text-emerald-400/60 text-xs mt-5"></p>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDU0RHh9ScIIPE5tSpjjhnAPN8ypF5T9EE",
    authDomain: "butchers-cricket.firebaseapp.com",
    projectId: "butchers-cricket",
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);

  // pill colour schemes per day
  const SCHEMES = {
    friday:      { badge: 'bg-purple-600',  pill: 'bg-purple-50 text-purple-800 border border-purple-200'  },
    saturday:    { badge: 'bg-emerald-600', pill: 'bg-emerald-50 text-emerald-800 border border-emerald-200' },
    sunday:      { badge: 'bg-blue-600',    pill: 'bg-blue-50 text-blue-800 border border-blue-200'         },
    monday:      { badge: 'bg-orange-500',  pill: 'bg-orange-50 text-orange-800 border border-orange-200'   },
    unavailable: { badge: 'bg-red-500',     pill: 'bg-red-50 text-red-700 border border-red-200'            },
  };

  function nextSaturday() {
    const now = new Date();
    const day = now.getDay();
    const daysUntilSat = day === 6 ? 0 : day === 0 ? 6 : (6 - day);
    const sat = new Date(now);
    sat.setDate(now.getDate() + daysUntilSat);
    return sat;
  }

  function fmt(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function getDays(v) {
    if (v.days !== undefined) return v.days;
    if (v.vote === 'both') return ['saturday', 'sunday'];
    if (v.vote === 'unavailable') return [];
    if (v.vote) return [v.vote];
    return [];
  }

  function firstName(name) {
    const parts = (name || '').trim().split(/\s+/);
    return parts[0] + (parts.length > 1 ? ' ' + parts[parts.length - 1][0] : '');
  }

  async function load() {
    let weekKey = nextSaturday().toISOString().slice(0, 10);
    let extraDates = [];
    let friLabel = 'Friday', satLabel = 'Saturday', sunLabel = 'Sunday', monLabel = 'Monday';

    try {
      const pollSnap = await getDoc(doc(db, 'config', 'poll'));
      if (pollSnap.exists()) {
        const pd = pollSnap.data();
        if (pd.satDate) {
          weekKey = pd.satDate;
          const sat = new Date(pd.satDate + 'T12:00:00');
          const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
          const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
          const mon = new Date(sat); mon.setDate(sat.getDate() + 2);
          friLabel = 'Friday '   + fmt(fri.toISOString().slice(0, 10));
          satLabel = 'Saturday ' + fmt(pd.satDate);
          sunLabel = 'Sunday '   + fmt(sun.toISOString().slice(0, 10));
          monLabel = 'Monday '   + fmt(mon.toISOString().slice(0, 10));
        }
        if (pd.extraDates) extraDates = pd.extraDates;
      }
    } catch (_) {}

    document.getElementById('weekLabel').textContent = 'Week of ' + fmt(weekKey);

    const groups = { friday: [], saturday: [], sunday: [], monday: [], unavailable: [] };

    const snap = await getDocs(collection(db, 'votes'));
    snap.forEach(d => {
      const v = d.data();
      if (v.week !== weekKey) return;
      const name = firstName(v.player || d.id);
      const days = getDays(v);
      if (days.includes('friday'))   groups.friday.push(name);
      if (days.includes('saturday')) groups.saturday.push(name);
      if (days.includes('sunday'))   groups.sunday.push(name);
      if (days.includes('monday'))   groups.monday.push(name);
      if (!days.length) groups.unavailable.push(name);
    });

    const sections = [
      ...(extraDates.includes('friday')  ? [{ key: 'friday',      label: friLabel,       icon: '📅' }] : []),
      { key: 'saturday',    label: satLabel,        icon: '📅' },
      { key: 'sunday',      label: sunLabel,        icon: '📅' },
      ...(extraDates.includes('monday')  ? [{ key: 'monday',      label: monLabel,       icon: '📅' }] : []),
      { key: 'unavailable', label: 'Not Available', icon: '❌' },
    ];

    const grid = document.createElement('div');
    grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';

    sections.forEach((s, i) => {
      const scheme = SCHEMES[s.key];
      const names  = groups[s.key];
      const card = document.createElement('div');
      card.className = 'card-animate bg-white/95 backdrop-blur-sm rounded-2xl p-4 shadow-xl ring-1 ring-white/20';
      card.style.animationDelay = (i * 0.08) + 's';

      const pillsHtml = names.length
        ? names.map((n, j) => `<span class="pill-animate ${scheme.pill} text-xs font-medium px-3 py-1 rounded-full" style="animation-delay:${j*0.04}s">${n}</span>`).join('')
        : `<span class="text-gray-400 text-xs italic">No responses yet</span>`;

      card.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <span class="text-emerald-900 font-bold text-sm">${s.icon} ${s.label}</span>
          <span class="text-xs font-bold text-white px-2.5 py-0.5 rounded-full ${scheme.badge}">${names.length}</span>
        </div>
        <div class="flex flex-wrap gap-2">${pillsHtml}</div>`;

      grid.appendChild(card);
    });

    document.getElementById('root').className = '';
    document.getElementById('root').innerHTML = '';
    document.getElementById('root').appendChild(grid);
    document.getElementById('updatedAt').textContent =
      'Last updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadWithRetry(attempts = 3, delay = 1500) {
    for (let i = 0; i < attempts; i++) {
      try {
        await load();
        return;
      } catch (_) {
        if (i < attempts - 1) {
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }
    document.getElementById('root').innerHTML =
      '<p class="text-white text-center">Failed to load. <button onclick="loadWithRetry()" class="underline text-emerald-300">Tap to retry</button></p>';
  }

  loadWithRetry();
</script>
</body>
